# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: foundry-hosted-agents-ai-gateway-landing-zone
metadata:
  template: foundry-hosted-agents-ai-gateway-landing-zone@1.0.0
requiredVersions:
  extensions:
    azure.ai.agents: ">=1.0.0-beta.18"
infra:
  provider: bicep
  path: infra
  module: azd
services:
  demo-console:
    project: .
    host: containerapp
    language: docker
    docker:
      path: ./src/demo-console/Dockerfile
      context: .
      remoteBuild: true
  agent-maf:
    project: ./src/agents/maf
    host: azure.ai.agent
    language: docker
    docker:
      remoteBuild: true
    kind: hosted
    name: agent-maf
    description: Microsoft Agent Framework hosted agent that reaches models and tools through the selected gateway.
    startupCommand: python main.py
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      HOSTED_DEFAULT_GATEWAY: ${AGENT_DEFAULT_GATEWAY}
      APIM_GATEWAY_URL: ${APIM_GATEWAY_URL}
      LLM_API_PATH: ${LLM_API_PATH}
      MCP_CATALOG_URL: ${MCP_CATALOG_URL}
      MCP_RECORDS_URL: ${MCP_RECORDS_URL}
      GATEWAY_AUDIENCE: https://cognitiveservices.azure.com
      AIGW_GATEWAY_URL: ${AIGW_GATEWAY_URL}
      AIGW_MCP_CATALOG_URL: ${AIGW_MCP_CATALOG_URL}
      AIGW_MCP_RECORDS_URL: ${AIGW_MCP_RECORDS_URL}
      KEY_VAULT_URI: ${KEY_VAULT_URI}
      AIGW_RUNTIME_KEY_SECRET_NAME: ${AIGW_RUNTIME_KEY_SECRET_NAME}
      MODEL_DEPLOYMENT_NAME: ${MODEL_DEPLOYMENT_NAME}
      DOMAIN_PROFILE: ${DOMAIN_PROFILE}
      HOSTED_PROTOCOL: responses
      HOSTED_RUNTIME: foundry-hosted
      # AIGW_KEY_DELIVERY=keyvault (default) reads the runtime key from Key Vault. AIGW_RUNTIME_KEY is only populated by
      # postprovision when AIGW_KEY_DELIVERY=env, an explicit demo-only opt-in (see docs); otherwise it is empty.
      AIGW_KEY_DELIVERY: ${AIGW_KEY_DELIVERY}
      AIGW_RUNTIME_KEY: ${AIGW_RUNTIME_KEY}
    hooks:
      postdeploy:
        # Grants the deployed agent's instance identity Key Vault Secrets User; cwd is the service path.
        shell: pwsh
        interactive: true
        continueOnError: false
        run: |
          & (Join-Path (Resolve-Path ../../..).Path 'infra/hooks/postdeploy-agents.ps1') -AgentName agent-maf
          exit $LASTEXITCODE
  agent-langgraph:
    project: ./src/agents/langgraph
    host: azure.ai.agent
    language: docker
    docker:
      remoteBuild: true
    kind: hosted
    name: agent-langgraph
    description: LangGraph hosted agent that reaches models and tools through the selected gateway.
    startupCommand: python main.py
    container:
      resources:
        cpu: "0.5"
        memory: 1Gi
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      HOSTED_DEFAULT_GATEWAY: ${AGENT_DEFAULT_GATEWAY}
      APIM_GATEWAY_URL: ${APIM_GATEWAY_URL}
      LLM_API_PATH: ${LLM_API_PATH}
      MCP_CATALOG_URL: ${MCP_CATALOG_URL}
      MCP_RECORDS_URL: ${MCP_RECORDS_URL}
      GATEWAY_AUDIENCE: https://cognitiveservices.azure.com
      AIGW_GATEWAY_URL: ${AIGW_GATEWAY_URL}
      AIGW_MCP_CATALOG_URL: ${AIGW_MCP_CATALOG_URL}
      AIGW_MCP_RECORDS_URL: ${AIGW_MCP_RECORDS_URL}
      KEY_VAULT_URI: ${KEY_VAULT_URI}
      AIGW_RUNTIME_KEY_SECRET_NAME: ${AIGW_RUNTIME_KEY_SECRET_NAME}
      MODEL_DEPLOYMENT_NAME: ${MODEL_DEPLOYMENT_NAME}
      DOMAIN_PROFILE: ${DOMAIN_PROFILE}
      HOSTED_PROTOCOL: responses
      HOSTED_RUNTIME: foundry-hosted
      # AIGW_KEY_DELIVERY=keyvault (default) reads the runtime key from Key Vault. AIGW_RUNTIME_KEY is only populated by
      # postprovision when AIGW_KEY_DELIVERY=env, an explicit demo-only opt-in (see docs); otherwise it is empty.
      AIGW_KEY_DELIVERY: ${AIGW_KEY_DELIVERY}
      AIGW_RUNTIME_KEY: ${AIGW_RUNTIME_KEY}
    hooks:
      postdeploy:
        # Grants the deployed agent's instance identity Key Vault Secrets User; cwd is the service path.
        shell: pwsh
        interactive: true
        continueOnError: false
        run: |
          & (Join-Path (Resolve-Path ../../..).Path 'infra/hooks/postdeploy-agents.ps1') -AgentName agent-langgraph
          exit $LASTEXITCODE
  catalog-mcp:
    project: ./src/catalog-mcp
    host: containerapp
    language: docker
    docker:
      remoteBuild: true
    environmentVariables:
      - name: PORT
        value: "8080"
      - name: DOMAIN_PROFILE
        value: ${DOMAIN_PROFILE}
      - name: APPLICATIONINSIGHTS_CONNECTION_STRING
        value: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
  records-api:
    project: ./src/records-api
    host: containerapp
    language: docker
    docker:
      remoteBuild: true
    environmentVariables:
      - name: PORT
        value: "8080"
      - name: DOMAIN_PROFILE
        value: ${DOMAIN_PROFILE}
      - name: APPLICATIONINSIGHTS_CONNECTION_STRING
        value: ${APPLICATIONINSIGHTS_CONNECTION_STRING}
hooks:
  preprovision:
    windows:
      shell: pwsh
      run: ./infra/hooks/preprovision.ps1
      interactive: true
      continueOnError: false
  postprovision:
    windows:
      shell: pwsh
      run: ./infra/hooks/postprovision.ps1
      interactive: true
      continueOnError: false
